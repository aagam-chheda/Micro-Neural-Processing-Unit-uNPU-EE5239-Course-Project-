" y="110" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="9" font-weight="normal" text-anchor="middle" fill="#059669">only if all pass</text><polyline points="710,120 780,120" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ac)"/><text x="510" y="210" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="bold" text-anchor="start" fill="#1f2937">&lt;case&gt;_a.hex</text><text x="650" y="210" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6b7280">16 bytes, A row-major (zero-padded to 4×4)</text><text x="510" y="232" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="bold" text-anchor="start" fill="#1f2937">&lt;case&gt;_w.hex</text><text x="650" y="232" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6b7280">16 bytes, B (W) row-major</text><text x="510" y="254" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="bold" text-anchor="start" fill="#1f2937">&lt;case&gt;_c.hex</text><text x="650" y="254" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6b7280">M×4 INT32 words, expected C</text><text x="510" y="276" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="bold" text-anchor="start" fill="#1f2937">&lt;case&gt;_meta.txt</text><text x="650" y="276" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6b7280">M=, MODE=, K=, N= (append-only order)</text><text x="30" y="310" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937">Cases: identity, all_ones, cross_terms (hand-checked) · random_signed, random_unsigned · seq_m1, seq_k1, seq_n1, seq_mixed · crv_0000…crv_0063</text><text x="30" y="334" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#6b7280">If any self-check fails, golden.c exits 1 BEFORE writing a single file, so stale or wrong vectors can never reach a testbench.</text></svg>