<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c026d3"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="490.0" y="26" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">The behavioural SRAM model inside dma / seq / top testbenches</text><rect x="40" y="110" width="160" height="80" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.4"/><text x="120.0" y="147.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">DUT</text><text x="120.0" y="163.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">unpu_dma or</text><text x="120.0" y="176.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">unpu_top</text><rect x="300" y="60" width="380" height="250" rx="6" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="490" y="84" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">tb-side SRAM model</text><rect x="320" y="100" width="160" height="70" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><text x="400.0" y="132.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">mem[]</text><text x="400.0" y="148.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">2^15 – 2^19 words</text><rect x="500" y="100" width="160" height="70" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="580.0" y="132.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">back-pressure</text><text x="580.0" y="148.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">0–5 or 50–100</text><text x="580.0" y="161.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">cycles per beat</text><rect x="320" y="200" width="160" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="400.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">mem_ix()</text><text x="400.0" y="248.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">bounds check on</text><text x="400.0" y="261.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">every TB index</text><rect x="500" y="200" width="160" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="580.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">window monitor</text><text x="580.0" y="248.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">beat above decode →</text><text x="580.0" y="261.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">FAIL unless wrap</text><polyline points="200,120 320,120" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#ad)"/><text x="205" y="112" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#059669">valid · addr · wdata</text><polyline points="320,150 200,150" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#ad)"/><text x="205" y="144" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#059669">rdata</text><polyline points="580,170 580,186 230,186 200,180" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#aw)"/><text x="205" y="200" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#d97706">dma_ready</text><rect x="720" y="100" width="230" height="150" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/><text x="835" y="126" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">Why it matters</text><text x="734" y="152" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">Always-ready memory hides</text><text x="734" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">valid/ready bugs. The window</text><text x="734" y="188" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">monitor catches address aliasing</text><text x="734" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">that Verilator&#x27;s 2-state wrap</text><text x="734" y="224" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">hid (found on Xcelium).</text><text x="40" y="350" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#6b7280">Random delays come from a seeded xorshift32 stream, so every failure is reproducible cycle for cycle.</text></svg>