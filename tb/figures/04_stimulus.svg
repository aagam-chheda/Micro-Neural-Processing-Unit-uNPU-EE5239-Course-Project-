<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c026d3"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="490.0" y="26" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">Five ways to choose stimulus — this suite uses all five</text><rect x="30" y="70" width="170" height="200" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="115" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">Directed</text><text x="115" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">hand-picked cases</text><text x="115" y="166" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">with known answers</text><text x="115" y="215" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">VECTOR 1–24 in pe_tb</text><text x="115" y="230" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">cross_terms, seq_m1</text><polyline points="200,170 220,170" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="220" y="70" width="170" height="200" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><text x="305" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">Exhaustive</text><text x="305" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">every possible input</text><text x="305" y="166" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">when the space is small</text><text x="305" y="215" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">256×256 × 2 modes</text><text x="305" y="230" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">= 131,072 PE checks</text><polyline points="390,170 410,170" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="410" y="70" width="170" height="200" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><text x="495" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">Constrained</text><text x="495" y="118" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">random (CRV)</text><text x="495" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">random but legal,</text><text x="495" y="166" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">fixed seed</text><text x="495" y="215" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">64 crv_* cases</text><text x="495" y="230" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">M,N,K ∈ 1..4, both modes</text><polyline points="580,170 600,170" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="600" y="70" width="170" height="200" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="685" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">Adversarial</text><text x="685" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">random, biased to</text><text x="685" y="166" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">extremes and edges</text><text x="685" y="215" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">0x00/0x7F/0x80/0xFF bias</text><text x="685" y="230" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">50–100-cycle stalls</text><polyline points="770,170 790,170" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="790" y="70" width="170" height="200" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.4"/><text x="875" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">Mutation</text><text x="875" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">break the RTL on</text><text x="875" y="166" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">purpose; tests must fail</text><text x="875" y="215" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">13 mutants, all caught</text><text x="875" y="230" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">by the suite</text><text x="30" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#6b7280">Left to right: more inputs covered, less human effort per case. The last column tests the TESTS, not the design.</text></svg>