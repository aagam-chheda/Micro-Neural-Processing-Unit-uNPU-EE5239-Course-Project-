<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c026d3"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="500.0" y="26" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">One simulation time step — why every testbench waits #1 after the edge</text><rect x="30" y="70" width="170" height="90" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="115" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Active</text><text x="115" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">blocking =, assign,</text><text x="115" y="136" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">RHS of &lt;= evaluated</text><polyline points="200,115 220,115" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="220" y="70" width="170" height="90" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/><text x="305" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Inactive</text><text x="305" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">#0 events</text><polyline points="390,115 410,115" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="410" y="70" width="170" height="90" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.4"/><text x="495" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">NBA</text><text x="495" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">&lt;= targets</text><text x="495" y="136" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">updated</text><polyline points="580,115 600,115" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="600" y="70" width="170" height="90" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/><text x="685" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Observed / Reactive</text><text x="685" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">assertions,</text><text x="685" y="136" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">programs</text><polyline points="770,115 790,115" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="790" y="70" width="170" height="90" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/><text x="875" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Postponed</text><text x="875" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">$strobe,</text><text x="875" y="136" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">$monitor</text><polyline points="390,160 390,190 115,190 115,160" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#am)"/><text x="250" y="205" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">loops back while events remain</text><text x="30" y="250" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937">@(posedge clk) wakes the testbench in the Active region of that edge — before the DUT&#x27;s &lt;= updates have landed.</text><text x="30" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937">Checking there would read the OLD register values. The extra #1 moves the check 1 ns later, after the NBA region.</text><text x="30" y="300" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="normal" text-anchor="start" fill="#c026d3">task automatic step;  @(posedge clk);  #1;  endtask</text><text x="30" y="330" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#6b7280">Inputs driven after the #1 are stable for a full cycle before the next edge — no races between testbench and DUT.</text></svg>