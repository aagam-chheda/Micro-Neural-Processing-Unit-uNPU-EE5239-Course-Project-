<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c026d3"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="500.0" y="26" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">Three levels of simulation — same testbench, different DUT</text><rect x="30" y="60" width="290" height="240" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><text x="175" y="90" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">RTL simulation</text><text x="175" y="120" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">rtl/*.sv</text><text x="175" y="185" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Zero-delay behavioural model.</text><text x="175" y="203" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Checks function + cycle timing.</text><text x="175" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#059669">PASS · 10 TBs · Xcelium + Verilator</text><polyline points="320,180 350,180" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="350" y="60" width="290" height="240" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.4"/><text x="495" y="90" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">Pre-layout GLS</text><text x="495" y="120" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">syn/out/unpu_top_cn.dc.v</text><text x="495" y="136" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">+ SCL cell models</text><text x="495" y="185" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Real gates from DC. Cell delays</text><text x="495" y="203" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">from specify blocks, no wires.</text><text x="495" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#c026d3">PASS · 343,341 checks</text><polyline points="640,180 670,180" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="670" y="60" width="290" height="240" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="815" y="90" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">Post-layout GLS</text><text x="815" y="120" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">ICC2 netlist + SDF</text><text x="815" y="185" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">Gates + extracted wire and cell</text><text x="815" y="203" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">delays; timing checks ON.</text><text x="815" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#d97706">not run yet</text><text x="30" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#6b7280">Each level catches what the one before cannot: synthesis mistakes (GLS), then real delays and setup/hold (SDF).</text></svg>