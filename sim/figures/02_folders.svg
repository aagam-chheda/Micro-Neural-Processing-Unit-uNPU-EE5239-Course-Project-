r TB</text><rect x="30" y="252" width="190" height="38" rx="4" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/><text x="42" y="276" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937">logs/</text><text x="240" y="269" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937">xrun -l logs and copies of history</text><text x="240" y="285" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#6b7280">compile.log, sim_pe.log, gls_top.log</text><rect x="30" y="300" width="190" height="38" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="42" y="324" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937">waves.shm/</text><text x="240" y="317" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937">SimVision waveform database</text><text x="240" y="333" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#6b7280">written by the -gui / probe session</text><rect x="30" y="348" width="190" height="38" rx="4" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/><text x="42" y="372" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937">.simvision/</text><text x="240" y="365" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937">SimVision bookmarks</text><text x="240" y="381" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#6b7280">created by opening the GUI</text><text x="30" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" 