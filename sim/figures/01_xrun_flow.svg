<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c026d3"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="500.0" y="26" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">What one xrun command does: compile → elaborate → simulate</text><rect x="30" y="80" width="170" height="80" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/><text x="115.0" y="117.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">Sources</text><text x="115.0" y="133.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">rtl/*.sv (filelist.f)</text><text x="115.0" y="146.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">tb/&lt;tb&gt;.sv</text><rect x="260" y="80" width="170" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="345.0" y="117.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">1. xmvlog</text><text x="345.0" y="133.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">parse + compile</text><text x="345.0" y="146.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">each module</text><rect x="490" y="80" width="170" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="575.0" y="117.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">2. xmelab</text><text x="575.0" y="133.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">link hierarchy,</text><text x="575.0" y="146.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">build snapshot</text><rect x="720" y="80" width="170" height="80" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.4"/><text x="805.0" y="117.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">3. xmsim</text><text x="805.0" y="133.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">run the snapshot</text><text x="805.0" y="146.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">(or -gui SimVision)</text><polyline points="200,120 260,120" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><polyline points="430,120 490,120" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><polyline points="660,120 720,120" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><text x="260" y="200" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#6b7280">xmvlog.args, xmvlog.files</text><text x="490" y="200" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#6b7280">xmelab.args, hdl.var, cds.lib</text><text x="720" y="200" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#6b7280">xmsim.args, logs/&lt;x&gt;.log</text><rect x="260" y="225" width="630" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><text x="575" y="250" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">&lt;xmlibdirname&gt;/worklib/xm.lnx8664.175.pak   — the compiled library + snapshot</text><text x="575" y="270" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">&lt;xmlibdirname&gt;/run.lnx8664.22.09.d/   — the arguments xrun passed to each step</text><text x="30" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937">-xmlibdirname picks the folder: sim/compile, sim/pe, gls/top, xrun_out/&lt;tb&gt;. Everything in it is regenerated on the next run.</text><text x="30" y="344" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#6b7280">-c stops after step 2 (compile/elaborate check only). -gui opens SimVision at step 3. -l writes the log that decides PASS/FAIL.</text><text x="30" y="368" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#6b7280">xrun also appends every invocation to &lt;xmlibdirname&gt;/history — the most reliable record of what was actually run.</text></svg>