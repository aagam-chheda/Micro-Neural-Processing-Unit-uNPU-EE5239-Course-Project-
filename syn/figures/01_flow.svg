b7280">into WORK library</text><polyline points="290,105 360,105" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="360" y="60" width="250" height="90" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="485" y="90" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">2. elaborate</text><text x="485" y="115" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">build unpu_top in</text><text x="485" y="131" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">generic gates (GTECH)</text><polyline points="610,105 680,105" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="680" y="60" width="250" height="90" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="805" y="90" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">3. link</text><text x="805" y="115" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">resolve every</text><text x="805" y="131" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">reference</text><polyline points="805,150 805,165 165,165 165,190" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="190" width="250" height="90" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="165" y="220" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">4. read_sdc</text><text x="165" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">clock, I/O delays,</text><text x="165" y="261" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">drive, loads, limits</text><polyline points="290,235 360,235" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="360" y="190" width="250" height="90" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="485" y="220" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">5. set env</text><text x="485" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">ss corner, wire</text><text x="485" y="261" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">load model 140000</text><polyline points="610,235 680,235" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="680" y="190" width="250" height="90" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.4"/><text x="805" y="220" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">6. compile</text><text x="805" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">map to SCL cells,</text><text x="805" y="261" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6b7280">-map_effort high</text><polyline points="805,280 805,295 165,295 165,320" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="320" width="250" height="90" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><text x="165" y="350" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">7. reports</text><text x="165" y="375" font-family="Helvetica, Arial, sans-serif" font-si