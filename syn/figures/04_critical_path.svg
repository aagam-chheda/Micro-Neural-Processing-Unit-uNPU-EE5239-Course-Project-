-size="11" font-weight="normal" text-anchor="end" fill="#1f2937">paddr[3] port: buffd1 driver + 0.2 pF wire</text><rect x="700.0" y="100" width="42.800000000000004" height="24" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="748.8" y="117" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">+1.07 → 8.07</text><text x="408" y="155" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#1f2937">u_apb: buffd1</text><rect x="742.8" y="138" width="9.6" height="24" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="758.4000000000001" y="155" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">+0.24 → 8.31</text><text x="408" y="193" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#1f2937">inv0d1 + invbd2</text><rect x="752.4000000000001" y="176" width="9.6" height="24" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="768.0" y="193" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">+0.24 → 8.55</text><text x="408" y="231" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#1f2937">u_csr: inv0d1 · nr03d1 · an02d2 · inv0d1 · oai222d1</text><rect x="762.0" y="214" width="81.6" height="24" rx="2" fill="#fdf4ff" stroke="#c026d3" stroke-width="1"/><text x="849.6" y="231" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">+2.04 → 10.59</text><text x="408" y="269" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#1f2937">u_apb: buffd1</text><rect x="843.6" y="252" width="10.0" height="24" rx="2" fill="#eff6ff" stroke