<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c026d3"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="500.0" y="26" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">One 20 ns clock period, and who gets which part of it</text><text x="60" y="70" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2937">APB read path paddr → prdata (combinational, through the CSR read mux):</text><rect x="60.0" y="85" width="308.0" height="40" rx="2" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/><text x="214.0" y="110.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">outside: 7 ns (35 %)</text><rect x="368.0" y="85" width="198.0" height="40" rx="2" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.4"/><text x="467.0" y="110.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">ours: 4.5 ns</text><rect x="566.0" y="85" width="308.0" height="40" rx="2" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/><text x="720.0" y="110.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">outside: 7 ns (35 %)</text><rect x="874.0" y="85" width="66.0" height="40" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="907.0" y="110.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">1.5</text><text x="60" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2937">Register → register inside the macro (e.g. the PE multiply-accumulate):</text><rect x="60.0" y="185" width="814.0" height="40" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><text x="467.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">18.5 ns available (slack +1.80 ns in the 14 Oct cleanup run)</text><rect x="874.0" y="185" width="66.0" height="40" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="907.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">1.5</text><polyline points="60.0,240 60.0,248" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="60.0" y="262" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">0</text><polyline points="148.0,240 148.0,248" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="148.0" y="262" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">2</text><polyline points="236.0,240 236.0,248" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="236.0" y="262" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">4</text><polyline points="324.0,240 324.0,248" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="324.0" y="262" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">6</text><polyline points="412.0,240 412.0,248" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="412.0" y="262" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">8</text><polyline points="500.0,240 500.0,248" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="500.0" y="262" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">10</text><polyline points="588.0,240 588.0,248" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="588.0" y="262" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">12</text><polyline points="676.0,240 676.0,248" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="676.0" y="262" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">14</text><polyline points="764.0,240 764.0,248" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="764.0" y="262" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">16</text><polyline points="852.0,240 852.0,248" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="852.0" y="262" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">18</text><polyline points="940.0,240 940.0,248" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="940.0" y="262" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">20</text><text x="500.0" y="282" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">ns</text><text x="60" y="315" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#6b7280">Orange = setup clock uncertainty (jitter 0.5 + skew 1.0 ns). Every number except the 20 ns period and the 1 pF output load is a deliberately harsh assumption.</text><text x="60" y="337" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937">The 4.5 ns APB window is the tightest budget in the design — which is why the worst slack is on that path, not in the multipliers.</text></svg>