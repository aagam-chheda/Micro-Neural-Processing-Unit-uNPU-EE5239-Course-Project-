<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c026d3"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="500.0" y="26" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">Three DC runs, one constraint decision</text><rect x="30" y="60" width="300" height="220" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="180" y="88" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">Run 1 · 8 Oct</text><text x="180" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">PM script as given + harsh SDC</text><text x="180" y="195" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">slack +0.02 (paddr→prdata)</text><text x="180" y="212" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">then cleanup: 80 max_transition</text><text x="180" y="229" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">violations, reg→reg +1.80 ns</text><polyline points="330,170 360,170" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="360" y="60" width="300" height="220" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="510" y="88" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">Run 2</text><text x="510" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">per-port max_transition 3.0 ns</text><text x="510" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">on data inputs, global 1.0 kept</text><text x="510" y="195" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">still violated: the tighter</text><text x="510" y="212" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">design-wide limit wins</text><text x="510" y="229" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">(248 VIOLATED lines)</text><polyline points="660,170 690,170" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="690" y="60" width="300" height="220" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><text x="840" y="88" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">Run 3 · 14 Oct</text><text x="840" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">global max_transition = 3.0 ns</text><text x="840" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">(the library&#x27;s own pin limit)</text><text x="840" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">+ change_names</text><text x="840" y="195" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">only max_area left (= minimise)</text><text x="840" y="212" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">slack +0.01 ns</text><text x="840" y="229" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">area 442,296 µm² (−2.8 %)</text><text x="30" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#6b7280">Why: buffd1 driving 0.2 pF already gives a 2.43 ns input edge, so a 1.0 ns limit could never be met at the ports. Driver and wire were NOT relaxed.</text></svg>