<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c026d3"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="490.0" y="26" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">Inside one PE (~14,600 µm²): two multipliers where one would do</text><rect x="40" y="70" width="251.88911704312113" height="70" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="165.94455852156057" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1f2937">DW_mult_uns (unsigned 8×8)</text><text x="165.94455852156057" y="118" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">4,089</text><rect x="291.88911704312113" y="70" width="238.58316221765912" height="70" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="411.1806981519507" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1f2937">DW_mult_tc (signed 8×8)</text><text x="411.1806981519507" y="118" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">3,873</text><rect x="530.4722792607803" y="70" width="116.67351129363449" height="70" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><text x="588.8090349075975" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1f2937">DW01_add (32-bit)</text><text x="588.8090349075975" y="118" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">1,894</text><rect x="647.1457905544148" y="70" width="259.65092402464063" height="70" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="776.9712525667351" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1f2937">48 flops (weight, act, psum)</text><text x="776.9712525667351" y="118" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">4,215</text><rect x="906.7967145790554" y="70" width="33.20328542094456" height="70" rx="2" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/><text x="40" y="175" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937">unpu_pe.sv selects signed or unsigned multiplication with an if/else, so DC builds BOTH multipliers and a 32-bit mux.</text><text x="40" y="197" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#d97706">Across 16 PEs the two multipliers are 127,390 µm² — 29.7 % of the whole macro.</text><text x="40" y="229" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937">Possible saving (estimate, not run): one 9×9 signed multiplier on sign- or zero-extended operands covers both modes.</text><text x="40" y="249" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937">At ~(81/64)× the 8×8 signed multiplier&#x27;s area that is ≈ 4,900 µm² per PE instead of 7,962: ≈ 49,000 µm² (~11 %) saved.</text><text x="40" y="281" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#6b7280">It changes rtl/unpu_pe.sv, so it would reopen the RTL freeze and need a full re-verification. Decide with the team first.</text></svg>