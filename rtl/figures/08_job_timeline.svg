<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c026d3"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="500.0" y="26" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">One 4×4×4 job, ideal memory (dma_ready = 1): 78 cycles from start_pulse to DONE</text><rect x="40.0" y="80" width="11.4" height="44" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><rect x="51.4" y="80" width="11.4" height="44" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><rect x="62.8" y="80" width="159.6" height="44" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/><text x="142.60000000000002" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">W_FETCH</text><text x="142.60000000000002" y="116" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">14 cyc</text><rect x="222.4" y="80" width="11.4" height="44" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><rect x="233.8" y="80" width="159.6" height="44" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/><text x="313.6" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">A_FETCH</text><text x="313.6" y="116" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">14 cyc</text><rect x="393.40000000000003" y="80" width="11.4" height="44" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><rect x="404.8" y="80" width="125.4" height="44" rx="2" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.2"/><text x="467.5" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">COMPUTE</text><text x="467.5" y="116" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">11 cyc</text><rect x="530.2" y="80" width="11.4" height="44" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><rect x="541.6" y="80" width="387.6" height="44" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/><text x="735.4" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">WRITE_OUTPUT</text><text x="735.4" y="116" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">34 cyc</text><rect x="929.2" y="80" width="11.4" height="44" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><polyline points="40.0,130 40.0,138" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="40.0" y="152" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">0</text><polyline points="154.0,130 154.0,138" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="154.0" y="152" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">10</text><polyline points="268.0,130 268.0,138" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="268.0" y="152" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">20</text><polyline points="382.0,130 382.0,138" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="382.0" y="152" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">30</text><polyline points="496.0,130 496.0,138" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="496.0" y="152" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">40</text><polyline points="610.0,130 610.0,138" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="610.0" y="152" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">50</text><polyline points="724.0,130 724.0,138" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="724.0" y="152" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">60</text><polyline points="838.0,130 838.0,138" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="838.0" y="152" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">70</text><text x="40" y="186" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937">W_FETCH = 1 + 2K + 4 (buffer load) + 1   ·   A_FETCH = 1 + 2M + 4 + 1   ·   COMPUTE = M + 7   ·   WRITE_OUTPUT = 1 + 2·M·N + 1</text><text x="40" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2937">Total:  cycles(start_pulse → DONE) = 26 + 2K + 3M + 2MN</text><text x="40" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#6b7280">Write-back of 16 INT32 words is 44 % of the job: the 32-bit memory port, not the array, sets the speed.</text></svg>