ht="normal" text-anchor="start" fill="#6b7280">wbuf: rows shifted in bottom-up (row 3 first), masked to K×N, transposed; all 16 PEs load in parallel on w_swap.</text><text x="40" y="380" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#6b7280">actbuf: rows written by index (row 0 first), masked to M×K; read combinationally by rd_row = COMPUTE cycle.</text></svg>