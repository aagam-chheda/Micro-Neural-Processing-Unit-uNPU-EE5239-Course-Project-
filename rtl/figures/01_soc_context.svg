#am)"/><text x="255" y="174" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6b7280">CPU loads / stores</text><text x="40" y="360" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#6b7280">Control: CPU writes 8 registers over APB.   Data: the NPU fetches A, B and writes C itself, through the arbiter.</text></svg>